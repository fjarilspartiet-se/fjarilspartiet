    <path style="fill:none;stroke:#916f6f;stroke-width:2.408;stroke-linecap:round" d="M 118.02155,116.9044 66.030886,89.285014" />
    <path style="fill:none;stroke:#916f6f;stroke-width:2.408;stroke-linecap:round" d="M 129.68602,108.95303 119.70286,58.862544" />
    <path style="fill:#916f6f;stroke:#000000;stroke-width:0.240799px" d="m 176.40313,207.11128 9.62352,7.30049 -2.86508,-13.64822" />
    <path style="fill:#916f6f;stroke:none;stroke-width:0.240799px" d="m 135.80237,130.15431 -10.89024,-0.47444 47.15142,75.46518 13.9631,9.26672 c -14.24817,-24.96933 -13.45029,-24.59059 -50.22428,-84.25746 z" />
    <path style="fill:#6c5353;stroke:none;stroke-width:0.240799px" d="m 140.61606,120.79857 -4.81369,9.35574 50.22428,84.25746 -0.85568,-17.56141 z" />
    <path style="fill:#916f6f;stroke:none;stroke-width:0.264583" d="m 129.95512,108.95037 a 13.327892,13.022045 0 0 1 13.32773,12.9563 13.327892,13.022045 0 0 1 -13.19316,13.08712 13.327892,13.022045 0 0 1 -13.46093,-12.82417 13.327892,13.022045 0 0 1 13.05725,-13.2166" />
  </g>

  <!-- Link -->
  <text x="400" y="780" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#4a3e3e">https://fjarilspartiet.se</text>
</svg>
