<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 800" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f6" />
      <stop offset="100%" stop-color="#f0f0f2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg-gradient)" />

  <!-- Title -->
  <text x="400" y="78" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#4a3e3e">Sverige är välskött.</text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#6c5353">Ändå ser vi inte vad som är på väg.</text>

  <!-- Loop -->
  <g>
    <!-- Dashed ring -->
    <circle cx="400" cy="405" r="175" fill="none" stroke="#de87cd" stroke-width="3" stroke-dasharray="7,9" />

    <!-- Clockwise arrowheads on the ring -->
    <path d="M -9,-7 L 9,0 L -9,7 Z" fill="#de87cd" transform="translate(523.74,281.26) rotate(45)" />
    <path d="M -9,-7 L 9,0 L -9,7 Z" fill="#de87cd" transform="translate(523.74,528.74) rotate(135)" />
    <path d="M -9,-7 L 9,0 L -9,7 Z" fill="#de87cd" transform="translate(276.26,528.74) rotate(225)" />
    <path d="M -9,-7 L 9,0 L -9,7 Z" fill="#de87cd" transform="translate(276.26,281.26) rotate(315)" />

    <!-- Hub -->
    <circle cx="400" cy="405" r="64" fill="#4a3e3e" />
    <text x="400" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Mönstret</text>
    <text x="400" y="422" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">upprepas</text>

    <!-- Node: top -->
    <g transform="translate(400,230)">
      <circle cx="0" cy="0" r="68" fill="#6c5353" stroke="#ffffff" stroke-width="4" />
      <text x="0" y="-26" font-family="sans-serif" font-size="24" text-anchor="middle">🌱</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Problem byggs</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">upp i det tysta</text>
    </g>

    <!-- Node: right -->
    <g transform="translate(575,405)">
      <circle cx="0" cy="0" r="68" fill="#916f6f" stroke="#ffffff" stroke-width="4" />
      <text x="0" y="-26" font-family="sans-serif" font-size="24" text-anchor="middle">💥</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Krisen</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">slår till</text>
    </g>

    <!-- Node: bottom -->
    <g transform="translate(400,580)">
      <circle cx="0" cy="0" r="68" fill="#6c5353" stroke="#ffffff" stroke-width="4" />
      <text x="0" y="-26" font-family="sans-serif" font-size="24" text-anchor="middle">🚨</text>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Panikåtgärd</text>
    </g>

    <!-- Node: left -->
    <g transform="translate(225,405)">
      <circle cx="0" cy="0" r="68" fill="#916f6f" stroke="#ffffff" stroke-width="4" />
      <text x="0" y="-26" font-family="sans-serif" font-size="24" text-anchor="middle">🔁</text>
      <text x="0" y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Glöms bort</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">— tills nästa</text>
    </g>
  </g>

  <!-- Bridge line -->
  <text x="400" y="688" font-family="Georgia, serif" font-style="italic" font-size="19" text-anchor="middle" fill="#6c5353">Vi vill bryta mönstret — och fånga problemen i tid.</text>

  <!-- Butterfly mark -->
  <g transform="matrix(0.16564008,0,0,0.16564008,378.8,696)">
    <path style="fill:#916f6f;stroke:#000000;stroke-width:0.240799px" d="m 186.02665,214.41177 c -0.6473,-1.38039 -57.11486,-97.03295 -57.11486,-97.03295" />
